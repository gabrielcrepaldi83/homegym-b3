<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f12" />
  <title>HomeGym B3 Move — 24kg</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    :root{--bg:#0d0f12;--card:#161a20;--elev:#1e232b;--border:#2a303b;--text:#f3f4f6;--muted:#9ca3af;--gold:#e5a93c;--gold-bg:rgba(229,169,60,.14);--green:#10b981;--green-bg:rgba(16,185,129,.14);--danger:#ef4444}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:115px}
    header{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.95);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:34px;height:34px;border-radius:8px;background:var(--gold-bg);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:13px}
    h1{margin:0;font-size:14px;font-weight:800}
    .sub{margin:2px 0 0;font-size:11px;color:var(--muted)}
    .wrap{max-width:680px;margin:0 auto;padding:14px 16px}
    .tabs,.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .subtabs{grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px}
    .tab{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:12px;padding:9px 6px;text-align:center;cursor:pointer}
    .tab strong{display:block;font-size:13px;color:var(--text)}
    .tab span{font-size:11px}
    .tab.active,.subtab.active{background:var(--gold);border-color:var(--gold);color:#111}
    .tab.active strong,.tab.active span{color:#111}
    .subtab{background:transparent;border:none;color:var(--muted);padding:8px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}
    .box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:12px}
    .box.opt{border-color:rgba(229,169,60,.35)}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .sec{display:flex;justify-content:space-between;margin:14px 0 7px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
    .badge{background:var(--green-bg);color:var(--green);border:1px solid rgba(16,185,129,.35);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
    .bar{height:7px;background:#232832;border-radius:999px;overflow:hidden;margin-top:8px}
    .fill{height:100%;background:var(--gold);width:0;transition:.2s}
    .title{font-size:15px;font-weight:700;margin:4px 0}
    .meta{font-size:11px;color:var(--muted);font-weight:600}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
    .tag{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--elev);border:1px solid var(--border);color:var(--muted)}
    .tag.ang{color:var(--gold);background:var(--gold-bg);border-color:rgba(229,169,60,.35);font-weight:600}
    .rest-lbl{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:2px 6px}
    .rest-lbl input{width:48px;padding:2px 4px;font-size:11px;text-align:center;background:#111419;border:1px solid #353c4a;border-radius:6px}
    .cue{font-size:12px;color:#cbd5e1;margin:8px 0 10px;line-height:1.4;background:#111419;border:1px solid #222731;border-radius:9px;padding:8px 10px}
    .set{display:grid;grid-template-columns:34px 1fr 1fr 38px;gap:6px;align-items:center;margin-top:6px;background:#111419;padding:6px 8px;border-radius:10px;border:1px solid #222731}
    .set.done{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.06)}
    select,input,button{background:var(--elev);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 6px;font-size:13px;font-weight:600}
    button{cursor:pointer}
    .gold{background:var(--gold-bg);color:var(--gold);border-color:rgba(229,169,60,.45)}
    .finish{width:100%;margin-top:12px;padding:13px;border-radius:14px;background:var(--green);border:none;color:#051b11;font-size:14px;font-weight:800}
    .chk.done{background:var(--green);color:#08120b;border-color:var(--green)}
    .timer{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:656px;background:#181d25;border:1px solid var(--gold);border-radius:14px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;z-index:30}
    .timer.show{display:flex}
    .tnum{font-size:20px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
    .nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(13,15,18,.97);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px}
    .nbtn{background:transparent;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;font-size:11px;font-weight:700}
    .nbtn.active{background:var(--gold-bg);color:var(--gold)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .scard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px}
    .sval{font-size:18px;font-weight:800;color:var(--gold);margin-top:3px}
    .delta{font-size:11px;font-weight:700;margin-top:2px;color:var(--green)}
    .fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
    .fld input{width:100%}
    .hitem{background:#111419;border:1px solid #222731;border-radius:10px;padding:9px;margin-top:7px}
    .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .pill{font-size:11px;background:var(--elev);border:1px solid var(--border);padding:3px 7px;border-radius:6px}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">B3</div>
      <div><h1>HOMEGYM B3 MOVE</h1><p class="sub">Par 24kg • Full Body 3x</p></div>
    </div>
    <button class="gold" onclick="installApp()">Instalar App</button>
  </header>

  <div class="wrap">
    <div id="vTreino">
      <div class="tabs">
        <div class="tab active" onclick="setDay(0)"><strong>Dia 1</strong><span>Peito</span></div>
        <div class="tab" onclick="setDay(1)"><strong>Dia 2</strong><span>Pernas</span></div>
        <div class="tab" onclick="setDay(2)"><strong>Dia 3</strong><span>Costas/Ombros</span></div>
      </div>
      <div class="box">
        <div class="top">
          <div><strong id="dTitle" style="font-size:15px;display:block"></strong><div class="meta" id="dSub"></div></div>
          <button class="badge" id="cycBtn" onclick="nextCycle()">Ciclo 1</button>
        </div>
        <div class="meta" style="margin-top:8px" id="pTxt">0/0 séries (0%)</div>
        <div class="bar"><div class="fill" id="pBar"></div></div>
      </div>
      <div class="sec"><span>Base Prioritária</span><span>✓ inicia descanso</span></div>
      <div id="baseList"></div>
      <div class="sec"><span>Opcionais</span></div>
      <div id="optList"></div>
      <button class="finish" onclick="finishWorkout()">✓ Concluir e Salvar Treino</button>
      <button style="width:100%;margin-top:8px" onclick="clearDone()">Limpar Checks da Sessão</button>
    </div>

    <div id="vCiclos" style="display:none">
      <div class="box">
        <strong style="font-size:15px;display:block">Ciclos &amp; Variações</strong>
        <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-top:10px;margin-bottom:0">
          <button id="cb1" onclick="setCycle(1)">Ciclo 1</button>
          <button id="cb2" onclick="setCycle(2)">Ciclo 2</button>
          <button id="cb3" onclick="setCycle(3)">Ciclo 3</button>
        </div>
      </div>
      <div id="cycList"></div>
    </div>

    <div id="vEvo" style="display:none">
      <div class="subtabs">
        <button class="subtab active" id="stCargas" onclick="setSub('cargas')">🏋️ Cargas &amp; Treinos</button>
        <button class="subtab" id="stCorpo" onclick="setSub('corpo')">⚖️ Composição Corporal</button>
      </div>

      <div id="subCargasView">
        <div class="grid2" id="cargaStats"></div>
        <div class="box"><strong style="font-size:14px">Recordes Pessoais (PRs)</strong><div id="prList" style="margin-top:6px"></div></div>
        <div class="box"><strong style="font-size:14px">Histórico de Sessões</strong><div id="sessList"></div></div>
      </div>

      <div id="subCorpoView" style="display:none">
        <div class="box">
          <div class="top">
            <strong style="font-size:14px">Nova Medição Corporal</strong>
            <div style="width:95px"><label class="meta">Altura (cm)</label><input type="number" id="bAlt" placeholder="178" style="width:100%;padding:4px 6px" onchange="setHeight(this.value)" /></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div class="fld"><label>Data</label><input type="date" id="bData" /></div>
            <div class="fld"><label>Peso (kg)</label><input type="number" step="0.1" id="bPeso" oninput="calcBody()" /></div>
            <div class="fld"><label>Gordura Corporal (%)</label><input type="number" step="0.1" id="bFat" oninput="calcBody()" /></div>
            <div class="fld"><label>Massa livre de gordura (kg)</label><input type="number" step="0.1" id="bLean" /></div>
            <div class="fld"><label>Gordura subcutânea (%)</label><input type="number" step="0.1" id="bSub" /></div>
            <div class="fld"><label>IMC</label><input type="number" step="0.1" id="bImc" /></div>
          </div>
          <button class="finish" style="margin-top:6px;padding:11px" onclick="addBody()">+ Salvar Medição</button>
        </div>

        <div class="grid2" id="bodySummary"></div>

        <div class="box" id="chartCard" style="display:none">
          <strong style="font-size:14px">Evolução Gráfica</strong>
          <div class="pills" style="margin:8px 0">
            <button class="pill gold" id="m_weight" onclick="setMetric('weight')">Peso</button>
            <button class="pill" id="m_fat" onclick="setMetric('fat')">Gordura %</button>
            <button class="pill" id="m_lean" onclick="setMetric('lean')">Massa Livre</button>
            <button class="pill" id="m_sub" onclick="setMetric('sub')">Subcutânea %</button>
            <button class="pill" id="m_imc" onclick="setMetric('imc')">IMC</button>
          </div>
          <div id="chartArea"></div>
        </div>

        <div class="box"><strong style="font-size:14px">Histórico Corporal</strong><div id="bodyList"></div></div>
      </div>

      <div class="grid2">
        <button class="gold" onclick="exportData()">Exportar Backup</button>
        <button onclick="document.getElementById('impInput').click()">Importar Backup</button>
        <input type="file" id="impInput" accept=".json" style="display:none" onchange="importData(event)" />
      </div>
    </div>
  </div>

  <div class="timer" id="timer">
    <div><div class="meta">DESCANSO</div><div class="tnum" id="tDisp">01:30</div></div>
    <div style="display:flex;gap:6px">
      <button onclick="addTime(-15)">-15s</button>
      <button onclick="addTime(15)">+15s</button>
      <button class="gold" onclick="stopTimer()">Pular</button>
    </div>
  </div>

  <nav class="nav">
    <button class="nbtn active" id="nTreino" onclick="setNav('treino')"><span>🏋️</span><span>Treino</span></button>
    <button class="nbtn" id="nCiclos" onclick="setNav('ciclos')"><span>🔄</span><span>Ciclos &amp; Variações</span></button>
    <button class="nbtn" id="nEvo" onclick="setNav('evo')"><span>📈</span><span>Evolução</span></button>
  </nav>

  <script>
    const PESOS=[2.5,3.5,4.5,5.5,6.5,8,9,10,11.5,13.5,16,18,20.5,22.5,24];
    const TREINOS=[
      {t:"Dia 1: Full Body (Peito)",s:"Peitoral, Pernas, Costas, Ombros e Core",base:[
        {id:"d1_1",sets:4,reps:"8-12",rest:90,w:16,a:[{n:"Supino Reto com Halteres",ang:"Banco 0°",c:"Desça ~45° até a linha do peito e empurre com firmeza."},{n:"Supino Reto Pegada Neutra",ang:"Banco 0°",c:"Palmas frente a frente; conforto articular."},{n:"Supino Reto Pausa 2s",ang:"Banco 0°",c:"Pausa de 2s embaixo para tensão extra."}]},
        {id:"d1_2",sets:3,reps:"8-12",rest:90,w:13.5,a:[{n:"Agachamento Búlgaro",ang:"Pé no B3",c:"Tronco levemente inclinado; desça controlado."},{n:"Afundo Estático",ang:"Piso 15mm",c:"Base firme e empurre pelo calcanhar da frente."},{n:"Búlgaro Cadência 3-1-1",ang:"Pé no B3",c:"3s descendo e 1s de pausa embaixo."}]},
        {id:"d1_3",sets:3,reps:"8-12",rest:75,w:18,a:[{n:"Remada Serrote",ang:"Apoio B3 0°",c:"Puxe ao quadril com coluna neutra."},{n:"Remada Peito Apoiado",ang:"Banco 40°",c:"Puxe os halteres juntos com pausa no topo."},{n:"Remada Serrote Pausa 2s",ang:"Apoio B3",c:"2s de contração máxima no topo."}]},
        {id:"d1_4",sets:3,reps:"12-15",rest:60,w:8,a:[{n:"Elevação Lateral",ang:"Em pé / 85°",c:"Suba até a altura do ombro sem balançar."},{n:"Elevação Lateral Inclinada",ang:"Banco 60°",c:"Apoio lateral com tensão contínua."},{n:"Elevação Lateral Lenta",ang:"Em pé",c:"Descida controlada em 3 segundos."}]},
        {id:"d1_5",sets:3,reps:"12-15",rest:60,w:2.5,a:[{n:"Abdominal Infra no Banco",ang:"Banco 0°",c:"Eleve o quadril tirando a lombar do banco."},{n:"Abdominal Supra Curto",ang:"Banco 0°",c:"Suba apenas as escápulas com controle."},{n:"Abdominal Canivete",ang:"Banco 0°",c:"Movimento coordenado sem trancos."}]}
      ],opt:[
        {id:"d1_o1",sets:2,reps:"10-12",rest:75,w:13.5,a:[{n:"Supino Inclinado 22°",ang:"Banco 22°",c:"Foco em peitoral superior."},{n:"Crucifixo Inclinado 22°",ang:"Banco 22°",c:"Alongue bem sem bater os pesos."},{n:"Press Fechado",ang:"Banco 22°",c:"Halteres unidos durante o movimento."}]},
        {id:"d1_o2",sets:2,reps:"10-12",rest:60,w:9,a:[{n:"Tríceps Testa",ang:"Banco 0°",c:"Desça ao lado das têmporas com controle."},{n:"Tríceps Francês",ang:"Banco 85°",c:"Braço firme junto à orelha."},{n:"Tríceps Coice Apoiado",ang:"Banco 40°",c:"Extensão completa com pausa de 1s."}]}
      ]},
      {t:"Dia 2: Full Body (Pernas)",s:"Posterior, Quadríceps, Ombros, Costas e Core",base:[
        {id:"d2_1",sets:4,reps:"10-12",rest:90,w:20.5,a:[{n:"Stiff / RDL Halteres",ang:"Piso 15mm",c:"Quadril para trás e coluna neutra."},{n:"Stiff Unilateral",ang:"Mão no B3",c:"Maior exigência unilateral."},{n:"RDL Pausa 2s",ang:"Piso 15mm",c:"2s no alongamento do posterior."}]},
        {id:"d2_2",sets:3,reps:"12-15",rest:90,w:22.5,a:[{n:"Agachamento Goblet",ang:"1 Haltere",c:"Dumbbell junto ao peito com amplitude."},{n:"Agachamento Sumô",ang:"1 Haltere",c:"Base aberta e tronco firme."},{n:"Agachamento Frontal",ang:"2 Halteres",c:"Halteres nos ombros e tronco vertical."}]},
        {id:"d2_3",sets:3,reps:"8-12",rest:90,w:13.5,a:[{n:"Desenvolvimento Ombros",ang:"Banco 75°-85°",c:"Empurre acima da cabeça sem arquear."},{n:"Desenvolvimento Arnold",ang:"Banco 75°",c:"Gire os punhos na subida."},{n:"Desenvolvimento Unilateral",ang:"Banco 85°",c:"1 haltere por vez com core firme."}]},
        {id:"d2_4",sets:3,reps:"10-12",rest:75,w:16,a:[{n:"Remada Peito Apoiado 40°",ang:"Banco 40°",c:"Feche as escápulas no topo."},{n:"Pullover no Banco",ang:"Banco 0°",c:"Alongamento do dorsal com 1 haltere."},{n:"Remada Supinada",ang:"Banco 40°",c:"Palmas voltadas para cima."}]},
        {id:"d2_5",sets:3,reps:"35-45s",rest:60,w:2.5,a:[{n:"Prancha Abdominal",ang:"Solo",c:"Mantenha abdômen e glúteos firmes."},{n:"Prancha Toque no Ombro",ang:"Solo",c:"Sem girar o quadril."},{n:"Prancha RKC",ang:"Solo",c:"Tensão máxima por 25-35s."}]}
      ],opt:[
        {id:"d2_o1",sets:3,reps:"12-15",rest:45,w:16,a:[{n:"Panturrilha Unilateral",ang:"Mão no B3",c:"1s no topo e descida controlada."},{n:"Panturrilha Sentado",ang:"Sentado no B3",c:"Halteres nas coxas com amplitude."},{n:"Panturrilha Pausa 2s",ang:"Mão no B3",c:"2s embaixo sem impulso."}]},
        {id:"d2_o2",sets:2,reps:"12-15",rest:60,w:20.5,a:[{n:"Elevação Pélvica Banco",ang:"Escápulas B3",c:"Contraia forte os glúteos no topo."},{n:"Ponte Glúteo Unilateral",ang:"1 Perna no B3",c:"Intensidade unilateral com 24kg."},{n:"Elevação Pélvica Pausa 3s",ang:"Escápulas B3",c:"3s no pico de contração."}]}
      ]},
      {t:"Dia 3: Full Body (Costas/Ombros)",s:"Dorsais, Deltoides, Peitoral Superior e Core",base:[
        {id:"d3_1",sets:4,reps:"8-12",rest:90,w:20.5,a:[{n:"Remada Unilateral Pesada",ang:"Apoio B3",c:"Descida controlada em 3 segundos."},{n:"Remada Curvada",ang:"Piso 15mm",c:"Tronco ~45° e puxada ao quadril."},{n:"Remada Alta Reps",ang:"Apoio B3",c:"12-15 reps controladas."}]},
        {id:"d3_2",sets:3,reps:"8-12",rest:90,w:16,a:[{n:"Supino Inclinado 22°-40°",ang:"Banco 22°-40°",c:"Ênfase em peitoral superior."},{n:"Crucifixo Inclinado",ang:"Banco 22°-40°",c:"Abertura controlada com alongamento."},{n:"Supino Inclinado 1 e 1/4",ang:"Banco 22°",c:"Meia repetição extra no fundo."}]},
        {id:"d3_3",sets:3,reps:"12-15",rest:60,w:8,a:[{n:"Crucifixo Invertido",ang:"Banco 40°",c:"Foco em posterior de ombro sem impulso."},{n:"Remada Alta Aberta",ang:"Banco 40°",c:"Cotovelos abertos para posterior/trapézio."},{n:"Crucifixo Invertido Unilateral",ang:"Banco 40°",c:"Amplitude estendida e controlada."}]},
        {id:"d3_4",sets:4,reps:"12-15",rest:60,w:8,a:[{n:"Elevação Lateral",ang:"Em pé / 85°",c:"Sem bater os halteres nas pernas."},{n:"Elevação Frontal",ang:"Banco 75°",c:"Até a linha dos olhos com controle."},{n:"Elevação em Y",ang:"Banco 40°",c:"Deltoide e trapézio inferior."}]},
        {id:"d3_5",sets:3,reps:"12-15",rest:60,w:2.5,a:[{n:"Abdominal Declinado",ang:"Banco -22°",c:"Desça com controle e sem forçar pescoço."},{n:"Abdominal Bicicleta",ang:"Banco 0°",c:"Alternância controlada de tronco/pernas."},{n:"Declinado com Carga",ang:"Banco -22°",c:"Haltere leve junto ao peito."}]}
      ],opt:[
        {id:"d3_o1",sets:2,reps:"10-12",rest:60,w:10,a:[{n:"Rosca Scott no B3",ang:"Banco 40°-60°",c:"Braço apoiado isolando o bíceps."},{n:"Rosca Martelo",ang:"Em pé / 75°",c:"Pegada neutra para braquial/antebraço."},{n:"Rosca Inclinada",ang:"Banco 60°",c:"Alongamento máximo do bíceps."}]},
        {id:"d3_o2",sets:2,reps:"10",rest:75,w:11.5,a:[{n:"Afundo Estático",ang:"Piso 15mm",c:"Estímulo leve fechando a semana."},{n:"Búlgaro Leve",ang:"Pé no B3",c:"Cadência controlada em 3s."},{n:"Passada Reversa",ang:"Piso 15mm",c:"Controle estável de quadril."}]}
      ]}
    ];

    let day=0,tmr=null,sec=0,promptEvt=null,metric="weight";
    let db=JSON.parse(localStorage.getItem("hg_b3_v5")||'{"cyc":1,"alt":{},"s":{},"rests":{},"hist":[],"body":[],"height":0}');
    if(!db.rests)db.rests={};if(!db.hist)db.hist=[];if(!db.body)db.body=[];

    window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();promptEvt=e;});
    function installApp(){if(promptEvt){promptEvt.prompt();promptEvt=null;}else alert("No Chrome: 3 pontinhos > Adicionar à tela inicial > Instalar.");}
    function save(){localStorage.setItem("hg_b3_v5",JSON.stringify(db));}

    function setNav(tab){
      ["vTreino","vCiclos","vEvo"].forEach(id=>document.getElementById(id).style.display="none");
      ["nTreino","nCiclos","nEvo"].forEach(id=>document.getElementById(id).classList.remove("active"));
      if(tab==="treino"){vTreino.style.display="block";nTreino.classList.add("active");}
      if(tab==="ciclos"){vCiclos.style.display="block";nCiclos.classList.add("active");renderCiclos();}
      if(tab==="evo"){vEvo.style.display="block";nEvo.classList.add("active");renderEvo();renderBody();}
    }
    function setSub(sub){
      subCargasView.style.display=sub==="cargas"?"block":"none";
      subCorpoView.style.display=sub==="corpo"?"block":"none";
      stCargas.classList.toggle("active",sub==="cargas");
      stCorpo.classList.toggle("active",sub==="corpo");
      if(sub==="corpo")renderBody();
    }
    function setDay(i){day=i;document.querySelectorAll(".tab").forEach((el,idx)=>el.classList.toggle("active",idx===i));render();}
    function setCycle(c){db.cyc=c;db.alt={};save();render();renderCiclos();}
    function nextCycle(){setCycle(db.cyc===3?1:db.cyc+1);}
    function toggleAlt(id){const cur=db.alt[id]??(db.cyc-1);db.alt[id]=(cur+1)%3;save();render();renderCiclos();}
    function setAlt(id,idx){db.alt[id]=idx;save();render();renderCiclos();}
    function getRest(ex){const v=Number(db.rests[ex.id]);return v>0?v:ex.rest;}
    function setRest(id,v,def){const n=parseInt(v,10);db.rests[id]=(!isNaN(n)&&n>0)?n:def;save();}

    function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close();},250);}catch(e){}}
    function upd(id,sIdx,k,v,rest){const key=id+"_"+sIdx;if(!db.s[key])db.s[key]={w:10,r:10,d:false};db.s[key][k]=v;save();if(k==="d"&&v)startTimer(rest);render();}
    function startTimer(s){clearInterval(tmr);sec=Math.max(5,Number(s)||60);timer.classList.add("show");drawTime();tmr=setInterval(()=>{sec--;if(sec<=0){stopTimer();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}else drawTime();},1000);}
    function addTime(n){sec=Math.max(0,sec+n);if(sec===0)stopTimer();else drawTime();}
    function stopTimer(){clearInterval(tmr);timer.classList.remove("show");}
    function drawTime(){tDisp.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");}

    function clearDone(){const d=TREINOS[day];[...d.base,...d.opt].forEach(ex=>{for(let s=0;s<ex.sets;s++){const k=ex.id+"_"+s;if(db.s[k])db.s[k].d=false;}});save();render();}
    function finishWorkout(){
      const d=TREINOS[day];let sets=0,vol=0,items=[];
      [...d.base,...d.opt].forEach(ex=>{
        const info=ex.a[db.alt[ex.id]??(db.cyc-1)]||ex.a[0];let maxW=0,done=0;
        for(let s=0;s<ex.sets;s++){const st=db.s[ex.id+"_"+s];if(st&&st.d){sets++;done++;const w=Number(st.w)||ex.w;const r=Number(st.r)||10;vol+=w*r;if(w>maxW)maxW=w;}}
        if(done>0)items.push({name:info.n,sets:done,maxW});
      });
      if(!sets){alert("Marque pelo menos uma série (✓) antes de salvar.");return;}
      db.hist.unshift({date:new Date().toLocaleDateString("pt-BR"),day:d.t,cycle:db.cyc,sets,vol:Math.round(vol),items});
      clearDone();save();setNav("evo");setSub("cargas");
    }

    function setHeight(v){db.height=parseFloat(v)||0;save();calcBody();}
    function calcBody(){
      const w=parseFloat(bPeso.value),fat=parseFloat(bFat.value),hCm=Number(db.height)||parseFloat(bAlt.value);
      if(!isNaN(w)&&w>0&&!isNaN(fat)&&fat>0&&fat<80)bLean.value=(w*(1-fat/100)).toFixed(1);
      if(!isNaN(w)&&w>0&&!isNaN(hCm)&&hCm>100){const hm=hCm/100;bImc.value=(w/(hm*hm)).toFixed(1);}
    }
    function addBody(){
      const iso=bData.value||new Date().toISOString().slice(0,10);
      const weight=parseFloat(bPeso.value),fat=parseFloat(bFat.value),lean=parseFloat(bLean.value),sub=parseFloat(bSub.value),imc=parseFloat(bImc.value);
      if(isNaN(weight)||weight<=0){alert("Informe o Peso (kg).");return;}
      const[y,m,d]=iso.split("-");
      db.body.unshift({id:Date.now(),iso,date:`${d}/${m}/${y}`,weight:Number(weight.toFixed(1)),imc:!isNaN(imc)?Number(imc.toFixed(1)):null,fat:!isNaN(fat)?Number(fat.toFixed(1)):null,lean:!isNaN(lean)?Number(lean.toFixed(1)):null,sub:!isNaN(sub)?Number(sub.toFixed(1)):null});
      db.body.sort((a,b)=>(b.iso||"").localeCompare(a.iso||""));save();
      ["bPeso","bFat","bLean","bSub","bImc"].forEach(id=>document.getElementById(id).value="");
      renderBody();
    }
    function delBody(id){db.body=db.body.filter(x=>x.id!==id);save();renderBody();}
    function setMetric(m){metric=m;["weight","fat","lean","sub","imc"].forEach(k=>document.getElementById("m_"+k).classList.toggle("gold",k===m));drawChart();}
    function deltaTxt(cur,prev,u){if(cur==null||prev==null)return"";const d=Number((cur-prev).toFixed(1));return`<div class="delta">${d>0?"+":""}${d}${u} vs anterior</div>`;}

    function renderBody(){
      if(!bData.value)bData.value=new Date().toISOString().slice(0,10);
      if(db.height)bAlt.value=db.height;
      const cur=db.body[0],prev=db.body[1];
      bodySummary.innerHTML=cur?`
        <div class="scard"><div class="meta">PESO (KG)</div><div class="sval">${cur.weight} kg</div>${deltaTxt(cur.weight,prev?.weight," kg")}</div>
        <div class="scard"><div class="meta">IMC</div><div class="sval">${cur.imc??"—"}</div>${deltaTxt(cur.imc,prev?.imc,"")}</div>
        <div class="scard"><div class="meta">GORDURA CORPORAL (%)</div><div class="sval">${cur.fat!=null?cur.fat+"%":"—"}</div>${deltaTxt(cur.fat,prev?.fat,"%")}</div>
        <div class="scard"><div class="meta">MASSA LIVRE DE GORDURA</div><div class="sval">${cur.lean!=null?cur.lean+" kg":"—"}</div>${deltaTxt(cur.lean,prev?.lean," kg")}</div>
        <div class="scard" style="grid-column:span 2"><div class="meta">GORDURA SUBCUTÂNEA (%)</div><div class="sval">${cur.sub!=null?cur.sub+"%":"—"}</div>${deltaTxt(cur.sub,prev?.sub,"%")}</div>
      `:"";
      drawChart();
      bodyList.innerHTML=db.body.length?db.body.map(b=>`
        <div class="hitem">
          <div class="top"><strong style="font-size:13px">${b.date} • ${b.weight} kg</strong><button style="padding:2px 7px;font-size:11px;color:var(--danger)" onclick="delBody(${b.id})">Excluir</button></div>
          <div class="pills">
            ${b.imc!=null?`<span class="pill">IMC: <b>${b.imc}</b></span>`:""}
            ${b.fat!=null?`<span class="pill">Gordura: <b>${b.fat}%</b></span>`:""}
            ${b.lean!=null?`<span class="pill">Massa Livre: <b>${b.lean} kg</b></span>`:""}
            ${b.sub!=null?`<span class="pill">Subcutânea: <b>${b.sub}%</b></span>`:""}
          </div>
        </div>`).join(""):`<div class="meta" style="margin-top:6px">Sem medições ainda.</div>`;
    }

    function drawChart(){
      const list=[...db.body].reverse().filter(x=>x[metric]!=null);
      if(list.length<2){chartCard.style.display="none";return;}
      chartCard.style.display="block";
      const vals=list.map(x=>Number(x[metric])),min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1,w=320,h=105,px=22,py=18;
      const pts=list.map((x,i)=>({x:px+(i/(list.length-1))*(w-px*2),y:(h-py)-((Number(x[metric])-min)/span)*(h-py*2),v:x[metric],d:x.date.slice(0,5)}));
      chartArea.innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;background:#111419;border-radius:10px;border:1px solid #222731"><polyline fill="none" stroke="#e5a93c" stroke-width="2.5" points="${pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ")}" />${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#e5a93c"/><text x="${p.x.toFixed(1)}" y="${(p.y-6).toFixed(1)}" fill="#f3f4f6" font-size="9" text-anchor="middle">${p.v}</text><text x="${p.x.toFixed(1)}" y="${h-3}" fill="#9ca3af" font-size="8" text-anchor="middle">${p.d}</text>`).join("")}</svg>`;
    }

    function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="backup_homegym_b3.json";a.click();}
    function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{db={cyc:1,alt:{},s:{},rests:{},hist:[],body:[],height:0,...JSON.parse(ev.target.result)};save();render();renderEvo();renderBody();alert("Backup restaurado!");}catch{alert("JSON inválido.");}};r.readAsText(f);}

    function renderEx(ex,i,isOpt){
      const idx=db.alt[ex.id]??(db.cyc-1),info=ex.a[idx]||ex.a[0],rest=getRest(ex),defR=parseInt(ex.reps,10)||10;
      let sets="";
      for(let s=0;s<ex.sets;s++){
        const st=db.s[ex.id+"_"+s]||{w:ex.w,r:defR,d:false};
        sets+=`<div class="set ${st.d?"done":""}"><span class="meta">S${s+1}</span><select onchange="upd('${ex.id}',${s},'w',parseFloat(this.value),${rest})">${PESOS.map(p=>`<option value="${p}" ${Number(st.w)===p?"selected":""}>${p} kg</option>`).join("")}</select><input type="number" min="1" max="150" value="${st.r}" onchange="upd('${ex.id}',${s},'r',parseInt(this.value)||0,${rest})"/><button class="chk ${st.d?"done":""}" onclick="upd('${ex.id}',${s},'d',${!st.d},${rest})">✓</button></div>`;
      }
      return`<div class="box ${isOpt?"opt":""}"><div class="top"><span class="meta">#${i+1} • ${ex.sets}×${ex.reps}</span><button onclick="toggleAlt('${ex.id}')">⇄ Var (${idx+1}/3)</button></div><div class="title">${info.n}</div><div class="tags"><span class="tag ang">📐 ${info.ang}</span><span class="tag">Sug: ${ex.w}kg</span><label class="rest-lbl">⏱ <input type="number" min="10" max="600" step="5" value="${rest}" onchange="setRest('${ex.id}',this.value,${ex.rest});render()"/>s</label></div><div class="cue">${info.c}</div>${sets}</div>`;
    }

    function render(){
      const d=TREINOS[day];dTitle.textContent=d.t;dSub.textContent=d.s;cycBtn.textContent="Ciclo "+db.cyc;
      baseList.innerHTML=d.base.map((ex,i)=>renderEx(ex,i,false)).join("");
      optList.innerHTML=d.opt.map((ex,i)=>renderEx(ex,i,true)).join("");
      let tot=0,ok=0;d.base.forEach(ex=>{for(let s=0;s<ex.sets;s++){tot++;if(db.s[ex.id+"_"+s]?.d)ok++;}});
      const pct=tot?Math.round((ok/tot)*100):0;pTxt.textContent=`${ok}/${tot} séries (${pct}%)`;pBar.style.width=pct+"%";
    }

    function renderCiclos(){
      [1,2,3].forEach(c=>document.getElementById("cb"+c).classList.toggle("gold",db.cyc===c));
      cycList.innerHTML=TREINOS.map(d=>`<div class="sec"><span>${d.t}</span></div>`+[...d.base,...d.opt].map(ex=>{const cur=db.alt[ex.id]??(db.cyc-1);return`<div class="box">${ex.a.map((v,idx)=>`<button style="width:100%;text-align:left;margin-top:4px" class="${cur===idx?"gold":""}" onclick="setAlt('${ex.id}',${idx})"><b>C${idx+1}:</b> ${v.n} <span class="meta">(${v.ang})</span></button>`).join("")}</div>`;}).join("");
    }

    function renderEvo(){
      const treinos=db.hist.length,series=db.hist.reduce((a,b)=>a+(b.sets||0),0),vol=db.hist.reduce((a,b)=>a+(b.vol||0),0);
      cargaStats.innerHTML=`<div class="scard"><div class="meta">TREINOS</div><div class="sval">${treinos}</div></div><div class="scard"><div class="meta">SÉRIES</div><div class="sval">${series}</div></div><div class="scard" style="grid-column:span 2"><div class="meta">VOLUME TOTAL</div><div class="sval">${vol.toLocaleString("pt-BR")} kg</div></div>`;
      const prs={};db.hist.forEach(h=>(h.items||[]).forEach(it=>{if(!prs[it.name]||it.maxW>prs[it.name])prs[it.name]=it.maxW;}));
      const keys=Object.keys(prs);
      prList.innerHTML=keys.length?keys.map(k=>`<div class="top" style="padding:5px 0;border-bottom:1px solid #222731;font-size:13px"><span>${k}</span><b style="color:var(--gold)">${prs[k]} kg</b></div>`).join(""):`<div class="meta">Conclua treinos para ver seus PRs.</div>`;
      sessList.innerHTML=db.hist.length?db.hist.map(h=>`<div class="hitem"><div class="top"><strong style="font-size:13px">${h.day}</strong><span class="meta">${h.date} • C${h.cycle}</span></div><div class="meta" style="margin-top:3px">${h.sets} séries • ${h.vol} kg</div></div>`).join(""):`<div class="meta" style="margin-top:6px">Nenhuma sessão salva ainda.</div>`;
    }

    if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
    render();
  </script>
</body>
</html>
